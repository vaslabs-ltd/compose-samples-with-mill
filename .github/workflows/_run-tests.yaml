name: Run Tests Reusable

on:
  workflow_call:
    inputs:
      use_custom_mill:
        type: boolean
        required: false
        default: false

jobs:
  android-tests:
    name: Android Tests (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [ JetLagged.app, JetNews.app, Jetsnack.app, Jetchat.app ]
    steps:
      - uses: actions/checkout@v6
      - name: Download and Restore Custom Mill Bundle
        if: ${{ inputs.use_custom_mill }}
        uses: actions/download-artifact@v8
        with:
          name: mill-custom-bundle
          path: mill-bundle
      - name: Setup Custom Mill
        if: ${{ inputs.use_custom_mill }}
        run: |
          # Restore cache from bundle
          if [ -f mill-bundle/mill-cache.tar.gz ]; then
            tar -xzf mill-bundle/mill-cache.tar.gz -C "$HOME"
          fi
          # Replace mill with link to the custom jar
          rm -f mill
          ln -s "$(pwd)/mill-bundle/mill-proguard.jar" mill
          chmod +x mill
        shell: bash
      - uses: coursier/cache-action@v8
      - uses: ./.github/actions/android-setup
      - uses: ./.github/actions/mill-android-test
        with:
          app-name: ${{ matrix.app }}
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: (!cancelled())
        with:
          fail_on_failure: false
          include_passed: false
          detailed_summary: true
          annotate_only: true
          require_tests: false
          report_paths: 'out/**/test-report.xml'

  android-run-app:
    name: Android Tests (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [ Reply.app, Jetcaster.mobile, Jetcaster.tv, Jetcaster.wear ]
        include:
          - app: Reply.app
            app-activity: com.example.reply.ui.MainActivity
          - app: Jetcaster.mobile
            app-activity: com.example.jetcaster.ui.MainActivity
          - app: Jetcaster.tv
            app-activity: com.example.jetcaster.tv.MainActivity
          - app: Jetcaster.wear
            app-activity: .MainActivity
    steps:
      - uses: actions/checkout@v6
      - name: Download and Restore Custom Mill Bundle
        if: ${{ inputs.use_custom_mill }}
        uses: actions/download-artifact@v8
        with:
          name: mill-custom-bundle
          path: mill-bundle
      - name: Setup Custom Mill
        if: ${{ inputs.use_custom_mill }}
        run: |
          if [ -f mill-bundle/mill-cache.tar.gz ]; then
            tar -xzf mill-bundle/mill-cache.tar.gz -C "$HOME"
          fi
          rm -f mill
          ln -s "$(pwd)/mill-bundle/mill-proguard.jar" mill
          chmod +x mill
        shell: bash
      - uses: coursier/cache-action@v8
      - uses: ./.github/actions/android-setup
      - uses: ./.github/actions/mill-android-run-apps
        with:
          app-name: ${{ matrix.app }}
          app-activity: ${{ matrix.app-activity }}

  android-unit-tests:
    name: Android Unit Tests (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [ Jetcaster.wear ]
    steps:
      - uses: actions/checkout@v6
      - name: Download and Restore Custom Mill Bundle
        if: ${{ inputs.use_custom_mill }}
        uses: actions/download-artifact@v8
        with:
          name: mill-custom-bundle
          path: mill-bundle
      - name: Setup Custom Mill
        if: ${{ inputs.use_custom_mill }}
        run: |
          if [ -f mill-bundle/mill-cache.tar.gz ]; then
            tar -xzf mill-bundle/mill-cache.tar.gz -C "$HOME"
          fi
          rm -f mill
          ln -s "$(pwd)/mill-bundle/mill-proguard.jar" mill
          chmod +x mill
        shell: bash
      - uses: coursier/cache-action@v8
      - uses: ./.github/actions/android-setup
      - uses: ./.github/actions/mill-android-unit-test
        with:
          app-name: ${{ matrix.app }}
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: (!cancelled())
        with:
          fail_on_failure: false
          include_passed: false
          detailed_summary: true
          annotate_only: true
          require_tests: false
          report_paths: 'out/**/test-report.xml'

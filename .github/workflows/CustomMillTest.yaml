name: Custom Mill Test
run-name: Custom Mill (${{ inputs.mill_repo }}:${{ inputs.mill_ref }})

on:
  workflow_dispatch:
    inputs:
      mill_repo:
        description: 'Mill repository (e.g. com-lihaoyi/mill)'
        required: true
        default: 'com-lihaoyi/mill'
      mill_ref:
        description: 'Mill ref: branch, tag, or commit SHA (e.g. main, v0.11.0, 1a2b3c4)'
        required: true
        default: 'main'

jobs:
  build-mill:
    name: Build Custom Mill
    runs-on: ubuntu-latest
    steps:
      - name: Workflow Summary
        run: |
          echo "### Custom Mill Build Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository**: ${{ inputs.mill_repo }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref**: ${{ inputs.mill_ref }}" >> $GITHUB_STEP_SUMMARY
        shell: bash

      - name: Checkout Mill
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.mill_repo || 'com-lihaoyi/mill' }}
          ref: ${{ inputs.mill_ref || 'main' }}
          fetch-depth: 1
          path: mill

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Mill Proguard Jar
        run: ./mill dist.installLocal
        working-directory: mill

      - name: Prepare Mill Bundle
        run: |
          mkdir -p mill-bundle
          cp mill/mill-proguard.jar mill-bundle/
          
          # Bundle ~/.ivy2 and ~/.cache directories
          tar -czf mill-bundle/mill-cache.tar.gz -C "$HOME" .ivy2 || true
        shell: bash

      - name: Upload Mill Bundle
        uses: actions/upload-artifact@v7
        with:
          name: mill-custom-bundle
          path: mill-bundle/
          if-no-files-found: error

  run-tests:
    needs: build-mill
    uses: ./.github/workflows/_run-tests.yaml
    with:
      use_custom_mill: true

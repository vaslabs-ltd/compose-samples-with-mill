inputs:
  app-name:
    description: 'The name of the Android app to test, e.g., JetNews or JetLagged'
    required: true

runs:
  using: "composite"
  steps:
    - name: Run instrumentation tests
      run: |
        ./mill show ${{ inputs.app-name }}.app.androidApk
        [ -d "${{ inputs.app-name }}/app/androidTest" ] && ./mill show ${{ inputs.app-name }}.app.createAndroidVirtualDevice
        [ -d "${{ inputs.app-name }}/app/androidTest" ] && ./mill --debug show ${{ inputs.app-name }}.app.startAndroidEmulator
        [ -d "${{ inputs.app-name }}/app/androidTest" ] && ./mill show ${{ inputs.app-name }}.app.androidTest
        [ -d "${{ inputs.app-name }}/app/androidTest" ] && ./mill show ${{ inputs.app-name }}.app.stopAndroidEmulator
      shell: bash
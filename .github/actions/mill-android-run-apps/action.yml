inputs:
  app-name:
    description: 'The name of the Android app to test, e.g., JetNews or JetLagged'
    required: true
  app-activity:
    description: 'The class qualifier of the activity to run'
    required: true

runs:
  using: "composite"
  steps:
    - name: Run apps
      run: |
        ./mill show ${{ inputs.app-name }}.androidApk
        ./mill show ${{ inputs.app-name }}.createAndroidVirtualDevice
        ./mill --debug show ${{ inputs.app-name }}.startAndroidEmulator
        ./mill show ${{ inputs.app-name }}.androidInstall
        ./mill show ${{ inputs.app-name }}.androidRun --activity ${{ inputs.app-activity }}
        ./mill show ${{ inputs.app-name }}.stopAndroidEmulator
      shell: bash
